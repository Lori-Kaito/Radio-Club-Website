<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POTA Activation 2026</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="DX1ARC_logo.png" type="image/png">
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #1a1a1a; }
        .slideshow-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <div class="slideshow-container" id="slideshow-container"></div>
    <script>
        window.onload = function() {
            const images = [
                "1.png","2.png","3.png","4.png","5.png","6.png","7.png","8.png","9.png",
                "10.png","11.png","12.png","13.png","14.png","15.png","16.png","17.png","18.png",
                "19.png","20.png","21.png","22.png","23.png","24.png","25.png","26.png","27.png",
                "28.png","29.png","30.png","31.png","32.png","33.png","34.png"
            ];
            function shuffle(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }
            shuffle(images);
            const container = document.getElementById("slideshow-container");
            images.forEach((img, idx) => {
                const slideDiv = document.createElement("div");
                slideDiv.className = "mySlides fade";
                const image = document.createElement("img");
                image.src = "gallery5/" + img;
                image.style.width = idx === 0 ? "80%" : "100%";
                slideDiv.appendChild(image);
                container.appendChild(slideDiv);
            });
            let slideIndex = 0;
            function showSlides() {
                let slides = document.getElementsByClassName("mySlides");
                for (let i = 0; i < slides.length; i++) { slides[i].style.display = "none"; }
                slideIndex++;
                if (slideIndex > slides.length) {slideIndex = 1}
                slides[slideIndex-1].style.display = "block";
                setTimeout(showSlides, 4000);
            }
            showSlides();
        };
    </script>
</body>
</html>
