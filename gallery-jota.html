<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOTA-JOTI 2025</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="DX1ARC_logo.png" type="image/png">
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #1a1a1a; }
        .slideshow-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <div class="slideshow-container" id="slideshow-container"></div>
    <script>
        window.onload = function() {
            const images = [
                "1.jpg","2.jpg","3.jpg","4.jpg","5.jpg","6.jpg","7.jpg","8.jpg","9.jpg",
                "10.jpg","11.jpg","12.jpg","13.jpg","14.jpg","15.jpg","16.jpg","17.jpg","18.jpg",
                "19.jpg","20.jpg","21.jpg","22.jpg","23.jpg","24.jpg","25.jpg","26.jpg","27.jpg",
                "28.jpg","29.jpg","30.jpg","31.jpg","32.jpg","33.jpg","34.jpg","35.jpg","36.jpg","37.jpg","38.jpg","39.jpg","40.jpg",
                "41.jpg","42.jpg","43.jpg","44.jpg","45.jpg","46.jpg","47.jpg","48.jpg","49.jpg","50.jpg",
                "51.jpg","52.jpg","53.jpg","54.jpg","55.jpg","56.jpg","57.jpg","58.jpg","59.jpg","60.jpg",
                "61.jpg","62.jpg","63.jpg","64.jpg","65.jpg","66.jpg","67.jpg","68.jpg","69.jpg","70.jpg",
                "71.jpg","72.jpg","73.jpg","74.jpg","75.jpg","76.jpg","77.jpg","78.jpg","79.jpg","80.jpg",
                "81.jpg","82.jpg","83.jpg"
            ];
            function shuffle(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }
            shuffle(images);
            const container = document.getElementById("slideshow-container");
            images.forEach((img, idx) => {
                const slideDiv = document.createElement("div");
                slideDiv.className = "mySlides fade";
                const image = document.createElement("img");
                image.src = "gallery3/" + img;
                image.style.width = idx === 0 ? "80%" : "100%";
                slideDiv.appendChild(image);
                container.appendChild(slideDiv);
            });
            let slideIndex = 0;
            function showSlides() {
                let slides = document.getElementsByClassName("mySlides");
                for (let i = 0; i < slides.length; i++) { slides[i].style.display = "none"; }
                slideIndex++;
                if (slideIndex > slides.length) {slideIndex = 1}
                slides[slideIndex-1].style.display = "block";
                setTimeout(showSlides, 4000);
            }
            showSlides();
        };
    </script>
</body>
</html>
