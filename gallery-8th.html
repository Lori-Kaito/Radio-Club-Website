<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8th Anniversary</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="DX1ARC_logo.png" type="image/png">
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #1a1a1a; }
        .slideshow-container { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <div class="slideshow-container" id="slideshow-container"></div>
    <script>
        window.onload = function() {
            const images = [
                "1.jpg","2.jpg","3.jpg","4.jpg","5.jpg","6.jpg","7.jpg","8.jpg","9.jpg",
                "10.jpg","11.jpg","12.jpg", "13.jpg","14.jpg","15.jpg","16.jpg","17.jpg","18.jpg",
                "19.jpg","20.jpg","21.jpg","22.jpg","23.jpg","24.jpg"
            ];
            function shuffle(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }
            shuffle(images);
            const container = document.getElementById("slideshow-container");
            images.forEach((img, idx) => {
                const slideDiv = document.createElement("div");
                slideDiv.className = "mySlides fade";
                const image = document.createElement("img");
                image.src = "gallery2/" + img;
                image.style.width = idx === 0 ? "80%" : "100%";
                slideDiv.appendChild(image);
                container.appendChild(slideDiv);
            });
            let slideIndex = 0;
            function showSlides() {
                let slides = document.getElementsByClassName("mySlides");
                for (let i = 0; i < slides.length; i++) { slides[i].style.display = "none"; }
                slideIndex++;
                if (slideIndex > slides.length) {slideIndex = 1}
                slides[slideIndex-1].style.display = "block";
                setTimeout(showSlides, 4000);
            }
            showSlides();
        };
    </script>
</body>
</html>
